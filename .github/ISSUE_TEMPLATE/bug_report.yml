name: Bug report
description: Report incorrect russh-extra behavior
title: "fix: "
labels:
  - C-bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal code or steps.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Rust, russh-extra, russh, OS.
    validations:
      required: true
  - type: textarea
    id: protocol_context
    attributes:
      label: SSH context
      description: Client/server, auth method, channel type, subsystem, forwarding mode, or local fixture used.
